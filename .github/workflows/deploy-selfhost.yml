name: Deploy self-hosted

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-selfhost
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy host-cloudflare
    if: github.repository == 'myohei/executor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.11-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.11-

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Inject admin emails
        working-directory: apps/host-cloudflare
        run: |
          node -e '
            const fs = require("fs");
            let t = fs.readFileSync("wrangler.jsonc", "utf8");
            t = t.replace(/("ADMIN_EMAILS":\s*")[^"]*(")/, `$1${process.env.ADMIN_EMAILS}$2`);
            fs.writeFileSync("wrangler.jsonc", t);
          '
        env:
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}

      - name: Diagnose D1
        working-directory: apps/host-cloudflare
        run: |
          echo "=== whoami ==="
          bunx wrangler whoami
          echo "=== d1 list ==="
          bunx wrangler d1 list --json
          echo "=== d1 list (names) ==="
          bunx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{JSON.parse(s).forEach(d=>console.log(d.name,d.uuid))}catch(e){console.error("parse error:",e.message)}})'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
